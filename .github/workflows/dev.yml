# Auto-deploy on push to `dev` branch.
#
# Targets the dev cluster (4689) in the existing Porter project (15081).
# If the team migrates dev to the new AWS cluster, update PORTER_CLUSTER,
# PORTER_PROJECT, and PORTER_DEPLOYMENT_TARGET_ID accordingly.

name: Deploy karaoke to dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  porter-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set Github tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Setup porter
        uses: porter-dev/setup-porter@v0.1.0
      - name: Deploy stack
        timeout-minutes: 30
        run: exec porter apply -f ./porter.yaml
        env:
          PORTER_APP_NAME: karaoke-dev
          PORTER_CLUSTER: "4689"
          PORTER_DEPLOYMENT_TARGET_ID: 4a24a192-04c8-421f-8fc2-22db1714fdc0
          PORTER_HOST: https://dashboard.porter.run
          PORTER_PR_NUMBER: ${{ github.event.number }}
          PORTER_PROJECT: "15081"
          PORTER_REPO_NAME: ${{ github.event.repository.name }}
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
          PORTER_TOKEN: ${{ secrets.PORTER_TOKEN }}
