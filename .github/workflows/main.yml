# Prod deploy is no longer automatic on push to main.
#
# To deploy to prod, trigger this workflow manually from the GitHub
# Actions UI: "Deploy karaoke to prod" → Run workflow.
#
# Cluster 5692 is the new AWS prod cluster in project 15081.

name: Deploy karaoke to prod

on:
  workflow_dispatch:

jobs:
  porter-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set Github tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Setup porter
        uses: porter-dev/setup-porter@v0.1.0
      - name: Deploy stack
        timeout-minutes: 30
        run: exec porter apply -f porter.yaml
        env:
          PORTER_CLUSTER: 5692
          PORTER_HOST: https://dashboard.porter.run
          PORTER_PROJECT: 15081
          PORTER_APP_NAME: karaoke
          PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
          PORTER_TOKEN: ${{ secrets.PORTER_TOKEN }}
