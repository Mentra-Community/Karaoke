<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Display Visualizer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        
        select, input[type="range"], button {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            font-size: 14px;
        }
        
        button {
            cursor: pointer;
            background: #4CAF50;
            border: none;
            padding: 10px 20px;
            margin-right: 10px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        .display-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .display {
            background: #000;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 20px;
            width: 400px;
            height: 200px;
            position: relative;
            font-family: 'Courier New', monospace;
        }
        
        .display-title {
            position: absolute;
            top: -10px;
            left: 20px;
            background: #1a1a1a;
            padding: 0 10px;
            font-size: 14px;
            color: #4CAF50;
        }
        
        .display-line {
            line-height: 1.6;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
        }
        
        .display-line.header {
            color: #4CAF50;
        }
        
        .display-line.divider {
            color: #666;
        }
        
        .display-line.preview {
            color: #888;
            font-size: 0.9em;
        }
        
        .display-line.current {
            color: #fff;
        }
        
        .char-counter {
            position: absolute;
            right: -50px;
            font-size: 10px;
            color: #666;
        }
        
        .char-counter.overflow {
            color: #f44336;
        }
        
        .timeline {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .timeline-bar {
            height: 40px;
            background: #333;
            border-radius: 4px;
            position: relative;
            margin: 10px 0;
        }
        
        .timeline-progress {
            height: 100%;
            background: #4CAF50;
            border-radius: 4px;
            transition: width 0.1s;
        }
        
        .timeline-markers {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
        }
        
        .timeline-marker {
            position: absolute;
            width: 2px;
            height: 100%;
            background: #f44336;
            opacity: 0.5;
        }
        
        .stats {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .stat-item {
            background: #333;
            padding: 15px;
            border-radius: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Karaoke Display Visualizer</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Song:</label>
                <select id="songSelect">
                    <option value="clint-eastwood">Clint Eastwood - Gorillaz</option>
                    <option value="hey-ya">Hey Ya! - OutKast</option>
                    <option value="bohemian-rhapsody">Bohemian Rhapsody - Queen</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Display Mode:</label>
                <select id="displayMode">
                    <option value="lyrics-focused">Lyrics Focused</option>
                    <option value="with-context">With Context</option>
                    <option value="minimal">Minimal</option>
                    <option value="song-info">Song Info Only</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Chunking Algorithm:</label>
                <select id="chunkingMode">
                    <option value="simple">Simple (8 words)</option>
                    <option value="smart">Smart (sentence-aware)</option>
                    <option value="timing">Timing-based</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Time Offset (sec):</label>
                <input type="range" id="timeOffset" min="-5" max="5" value="0" step="0.5">
                <span id="offsetValue">0</span>
            </div>
            
            <div class="control-group">
                <button id="playBtn">▶️ Play</button>
                <button id="pauseBtn">⏸️ Pause</button>
                <button id="resetBtn">⏮️ Reset</button>
                <span id="currentTime">0:00 / 0:00</span>
            </div>
        </div>
        
        <div class="display-container">
            <div class="display" id="currentDisplay">
                <div class="display-title">Current Algorithm</div>
                <div class="display-content"></div>
            </div>
            
            <div class="display" id="improvedDisplay">
                <div class="display-title">Improved Algorithm</div>
                <div class="display-content"></div>
            </div>
        </div>
        
        <div class="timeline">
            <h3>Timeline</h3>
            <div class="timeline-bar">
                <div class="timeline-progress" id="timelineProgress"></div>
                <div class="timeline-markers" id="timelineMarkers"></div>
            </div>
            <div id="timelineInfo"></div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Words per Chunk</div>
                <div class="stat-value" id="avgWords">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Chars per Line</div>
                <div class="stat-value" id="avgChars">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Lines per Chunk</div>
                <div class="stat-value" id="avgLines">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Total Chunks</div>
                <div class="stat-value" id="totalChunks">0</div>
            </div>
        </div>
    </div>
    
    <script type="module" src="./visualizer.js"></script>
</body>
</html>
